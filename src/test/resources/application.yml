spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:secretdrop-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

secretdrop:
  crypto:
    master-key: test-master-key-at-least-32-characters-long
  secrets:
    default-expiry-minutes: 60
    min-expiry-minutes: 5
    max-expiry-minutes: 10080
    default-max-views: 1
    max-max-views: 10
    max-content-bytes: 65536
    access-token-bytes: 24
    delete-token-bytes: 24
    max-passphrase-failures: 5
  rate-limit:
    reveal:
      capacity: 1000
      refill-per-minute: 1000
    status:
      capacity: 1000
      refill-per-minute: 1000