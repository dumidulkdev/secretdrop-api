services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secretdrop
      POSTGRES_USER: secretdrop
      POSTGRES_PASSWORD: secretdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretdrop -d secretdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/secretdrop
      DATABASE_USER: secretdrop
      DATABASE_PASSWORD: secretdrop
      SECRETDROP_MASTER_KEY: compose-master-key-replace-in-real-deployments
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: